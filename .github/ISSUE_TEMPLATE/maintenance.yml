name: Scheduled maintenance
description: Announce scheduled maintenance on status.quiklab.online (owner and collaborators only).
title: "Maintenance: "
labels: ["maintenance"]
body:
  - type: checkboxes
    id: components
    attributes:
      label: Components
      description: Which components will be under maintenance?
      options:
        - label: Website
        - label: Image compressor
        - label: PDF toolkit
        - label: jsDelivr CDN
        - label: DNS
        - label: Email
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Start (UTC)
      description: ISO 8601 in UTC.
      placeholder: "2026-10-01T02:00:00Z"
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: End (UTC)
      description: ISO 8601 in UTC.
      placeholder: "2026-10-01T03:00:00Z"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Moving DNS to a new provider. Brief interruptions are possible.
    validations:
      required: true
